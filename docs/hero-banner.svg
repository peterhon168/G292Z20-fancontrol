<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#101926" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ba360" />
      <stop offset="100%" stop-color="#3cba92" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgGrad)" />
  <rect width="1200" height="480" fill="url(#grid)" />

  <!-- Accent Top Glow Line -->
  <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#cyanGlow)" stroke-width="3" filter="url(#glow)" />

  <!-- Server Wireframe / Graphic -->
  <g transform="translate(680, 80)">
    <!-- Chassis Body -->
    <rect x="0" y="30" width="460" height="260" rx="8" fill="#141c2b" stroke="#23354d" stroke-width="2" />
    <rect x="10" y="40" width="440" height="240" rx="4" fill="#0d131f" stroke="#1b283d" stroke-width="1.5" />
    
    <!-- 8 Front Fan Grids -->
    <!-- Fan 1 to 4 -->
    <g transform="translate(30, 60)">
      <circle cx="35" cy="35" r="30" fill="#131c2a" stroke="#00f2fe" stroke-width="2" opacity="0.8" />
      <circle cx="35" cy="35" r="8" fill="#00f2fe" filter="url(#glow)" />
      <path d="M 35 10 L 35 60 M 10 35 L 60 35" stroke="#00f2fe" stroke-width="1.5" opacity="0.6" />
      <text x="35" y="85" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">FAN 1-2</text>
    </g>
    <g transform="translate(130, 60)">
      <circle cx="35" cy="35" r="30" fill="#131c2a" stroke="#00f2fe" stroke-width="2" opacity="0.8" />
      <circle cx="35" cy="35" r="8" fill="#00f2fe" filter="url(#glow)" />
      <path d="M 35 10 L 35 60 M 10 35 L 60 35" stroke="#00f2fe" stroke-width="1.5" opacity="0.6" />
      <text x="35" y="85" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">SYS 1-2</text>
    </g>
    <g transform="translate(230, 60)">
      <circle cx="35" cy="35" r="30" fill="#131c2a" stroke="#00f2fe" stroke-width="2" opacity="0.8" />
      <circle cx="35" cy="35" r="8" fill="#00f2fe" filter="url(#glow)" />
      <path d="M 35 10 L 35 60 M 10 35 L 60 35" stroke="#00f2fe" stroke-width="1.5" opacity="0.6" />
      <text x="35" y="85" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">FAN 3-4</text>
    </g>
    <g transform="translate(330, 60)">
      <circle cx="35" cy="35" r="30" fill="#131c2a" stroke="#00f2fe" stroke-width="2" opacity="0.8" />
      <circle cx="35" cy="35" r="8" fill="#00f2fe" filter="url(#glow)" />
      <path d="M 35 10 L 35 60 M 10 35 L 60 35" stroke="#00f2fe" stroke-width="1.5" opacity="0.6" />
      <text x="35" y="85" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">FAN 7-8</text>
    </g>

    <!-- Lower Status Indicators -->
    <rect x="30" y="180" width="400" height="75" rx="6" fill="#141d2d" stroke="#253752" stroke-width="1" />
    <text x="50" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">ACTIVE PROFILE</text>
    <text x="50" y="236" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="20" font-weight="bold">quiet_max</text>
    
    <text x="220" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">STEADY SPEED</text>
    <text x="220" y="236" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="20" font-weight="bold">3750 RPM</text>

    <text x="350" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">GPU TEMP</text>
    <text x="350" y="236" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="20" font-weight="bold">~72 °C</text>
  </g>

  <!-- Left Content / Typography -->
  <g transform="translate(80, 100)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="28" rx="14" fill="rgba(0, 242, 254, 0.1)" stroke="#00f2fe" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#00f2fe" filter="url(#glow)" />
    <text x="28" y="19" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="bold" letter-spacing="1">GIGABYTE G292-Z20</text>

    <!-- Main Title -->
    <text x="0" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="42" font-weight="800" letter-spacing="-0.5">BMC Fan Control</text>
    <text x="0" y="118" fill="url(#cyanGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="42" font-weight="800" letter-spacing="-0.5">&amp; Quiet Profile Tool</text>

    <!-- Description -->
    <text x="0" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="400">
      <tspan x="0" dy="0">High-density 2U EPYC + Multi-GPU Server Acoustic Optimization.</tspan>
      <tspan x="0" dy="24">Reverse-engineered MegaRAC SP-X Web API bypasses the 8-slot sensor trap</tspan>
      <tspan x="0" dy="24">to clamp jet-engine fan scream from 12000 RPM down to 3750 RPM.</tspan>
    </text>

    <!-- Stat Comparison Cards -->
    <g transform="translate(0, 250)">
      <!-- Card 1: Factory -->
      <rect x="0" y="0" width="220" height="60" rx="8" fill="#161b26" stroke="#2c1f24" stroke-width="1" />
      <text x="16" y="24" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold">FACTORY DEFAULT</text>
      <text x="16" y="48" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="18" font-weight="bold">9750 ~ 12000 RPM</text>

      <!-- Arrow -->
      <path d="M 235 30 L 255 30 M 248 23 L 255 30 L 248 37" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Card 2: Clamped -->
      <rect x="270" y="0" width="240" height="60" rx="8" fill="#0f2324" stroke="#00f2fe" stroke-width="1" />
      <text x="286" y="24" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold">QUIET_MAX PROFILE</text>
      <text x="286" y="48" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="18" font-weight="bold">3750 RPM (Hardware Limit)</text>
    </g>
  </g>
</svg>
